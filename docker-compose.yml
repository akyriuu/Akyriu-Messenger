services:
  db:
    image: postgres:17-alpine
    container_name: messages-akyriu-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: messages_akyriu
    ports:
      - '5434:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d messages_akyriu']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  app:
    image: node:22-alpine
    container_name: messages-akyriu-app
    working_dir: /app
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/messages_akyriu
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: >
      sh -c "npm install &&
      npx prisma generate &&
      npx prisma migrate deploy &&
      npm run start:dev"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  node_modules:
